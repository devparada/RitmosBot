# Este workflow instala las dependencias, ejecuta los tests y el linter Biome
# Para más información mira: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Ritmos CI

permissions:
  contents: read

on:
  push:
  pull_request:

# Si hay un action en progreso, cancela las actions antiguas si están en progreso
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x, 26.x]
    steps:
      - name: Clona el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configura Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Configura pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true

      - name: Instala las dependencias
        run:  pnpm install --frozen-lockfile --ignore-scripts

      - name: Ejecuta los tests
        run: pnpm test

      - name: Ejecuta el linter Biome
        continue-on-error: true
        run: pnpm run lint
