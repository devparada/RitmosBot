server:
  port: ${LAVALINK_PORT}
  address: ${LAVALINK_ADDRESS}
lavalink:
  server:
    # Estabilidad del flujo UDP
    bufferDurationMs: 600
    frameBufferDurationMs: 5000

    # Seguridad
    password: ${LAVALINK_PASSWORD}

    # Fuentes de audio (deshabilitado por defecto youtube)
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: true
    
    # Filtros
    filters:
      volume: true
      equalizer: true
  plugins:
    # Uso de snapshot temporal
    - dependency: "dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3"
      snapshot: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - WEBEMBEDDED
      - ANDROID_VR
      - ANDROID_MUSIC
      - TV
      - IOS
      - WEB
      - MWEB
